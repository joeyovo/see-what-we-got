<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棵树销售单查询系统</title>
    <link rel="stylesheet" href="css/screenshots.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>三棵树销售单查询系统</h1>
        <div class="query-form">
            <div class="date-range">
                <div class="input-group">
                    <label for="startDate">开始日期：</label>
                    <input type="date" id="startDate">
                </div>
                <div class="input-group">
                    <label for="endDate">结束日期：</label>
                    <input type="date" id="endDate">
                </div>
            </div>
            <div class="search-fields">
                <div class="input-group">
                    <label for="recipientQuery">收货人名称：</label>
                    <input type="text" id="recipientQuery" placeholder="请输入收货人名称">
                </div>
                <div class="input-group">
                    <label for="companyQuery">装修公司：</label>
                    <input type="text" id="companyQuery" placeholder="请输入装修公司名称">
                </div>
            </div>
            <div class="button-group">
                <button onclick="queryOrders()" class="primary-btn">查询</button>
                <button onclick="downloadResults()" class="secondary-btn" id="downloadBtn" disabled>下载查询结果</button>
            </div>
        </div>
        <div id="results"></div>
    </div>
    <script src="js/screenshots.js"></script>
</body>
</html>
